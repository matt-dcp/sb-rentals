name: Run Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path to the migration SQL file to run'
        required: true
        default: 'migrations/003_rls_lockdown.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable IPv6
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          python3 << 'PYEOF'
          import psycopg2, os
          conn = psycopg2.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=15)
          conn.autocommit = True
          cur = conn.cursor()
          with open(os.environ['MIGRATION_FILE']) as f:
              sql = f.read()
          cur.execute(sql)
          print('Migration completed successfully')
          cur.close()
          conn.close()
          PYEOF
