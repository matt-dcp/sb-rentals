name: Run Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 -c "
          import psycopg2, os
          conn = psycopg2.connect(os.environ['SUPABASE_DB_URL'])
          conn.autocommit = True
          cur = conn.cursor()
          with open('migrations/002_price_tracking.sql') as f:
              sql = f.read()
          cur.execute(sql)
          print('Migration completed successfully')
          cur.close()
          conn.close()
          "
